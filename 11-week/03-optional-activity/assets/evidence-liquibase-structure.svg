  <circle cx="132" cy="254" r="10" fill="#F26D6D"/>
  <circle cx="164" cy="254" r="10" fill="#F2C66E"/>
  <circle cx="196" cy="254" r="10" fill="#7AE7B3"/>
  <text x="232" y="262" fill="#EFF8F5" font-family="Consolas, monospace" font-size="26">database/</text>
  <text x="118" y="332" fill="#7AE7B3" font-family="Consolas, monospace" font-size="28">auth/</text>
  <text x="154" y="376" fill="#EFF8F5" font-family="Consolas, monospace" font-size="24">changelog-master.yaml</text>
  <text x="154" y="416" fill="#EFF8F5" font-family="Consolas, monospace" font-size="24">01_ddl/  02_dml/  03_dcl/  04_tcl/  05_rollbacks/</text>
  <text x="118" y="492" fill="#7AE7B3" font-family="Consolas, monospace" font-size="28">inventory/</text>
  <text x="154" y="536" fill="#EFF8F5" font-family="Consolas, monospace" font-size="24">changelog-master.yaml</text>
  <text x="154" y="576" fill="#EFF8F5" font-family="Consolas, monospace" font-size="24">01_ddl/  02_dml/  03_dcl/  04_tcl/  05_rollbacks/</text>
  <text x="118" y="664" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">Cada base sigue el mismo patron para estructura, datos,</text>
  <text x="118" y="698" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">seguridad y reversa. Eso evita cambios sueltos sin control.</text>

  <rect x="976" y="208" width="540" height="680" rx="24" fill="#08151C" stroke="#234954"/>
  <text x="1018" y="292" fill="#F2C66E" font-family="Arial, sans-serif" font-size="28" font-weight="700">Lectura para la exposicion</text>
  <text x="1018" y="366" fill="#EFF8F5" font-family="Arial, sans-serif" font-size="28">01_ddl</text>
  <text x="1140" y="366" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">estructura</text>
  <text x="1018" y="430" fill="#EFF8F5" font-family="Arial, sans-serif" font-size="28">02_dml</text>
  <text x="1140" y="430" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">datos base</text>
  <text x="1018" y="494" fill="#EFF8F5" font-family="Arial, sans-serif" font-size="28">03_dcl</text>
  <text x="1140" y="494" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">roles y seguridad</text>
  <text x="1018" y="558" fill="#EFF8F5" font-family="Arial, sans-serif" font-size="28">05_rollbacks</text>
  <text x="1228" y="558" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">reversa</text>
  <text x="1018" y="668" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">Liquibase ya no es codigo dificil de explicar.</text>
  <text x="1018" y="702" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">Es evidencia de orden en los datos del negocio.</text>
