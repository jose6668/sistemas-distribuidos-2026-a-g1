  <text x="84" y="112" fill="#EFF8F5" font-family="Arial, sans-serif" font-size="42" font-weight="700">Evidencia de estructura Liquibase</text>
  <text x="84" y="154" fill="#A4C0B7" font-family="Arial, sans-serif" font-size="24">auth e inventory con cambios ordenados y reversa definida</text>

